<!DOCTYPE html>
<html lang="no">

<head>
  <!-- Anti-FOUC for the curtain page-transition: runs before body paints, so if we
       arrived via a curtain-nav link (see shared.js), the curtain is held fully closed
       from the very first frame instead of flashing this page unclothed first. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('curtainNav') === '1') {
          document.documentElement.classList.add('curtain-entering');
          sessionStorage.removeItem('curtainNav');
        }
      } catch (e) { }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Busken — Radwa Godor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700&family=Roboto+Mono:wght@400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="case.css" />
</head>

<body>

  <!-- Curtain used for the nav-link page transitions (see shared.js's initNavTransitions
       / initEntryReveal). Placed first so it's the first thing painted, ahead of any
       page content beneath it. -->
  <div class="page-transition-curtain" aria-hidden="true"></div>

  <div class="progress" aria-hidden="true">
    <div class="progress__bar" data-progress></div>
  </div>

  <header>
    <a href="index.html" class="logo curtain-link">[Radwa Godor]<small>return: home</small></a>
    <nav class="nav-links">
      <a href="prosjekter.html" class="curtain-link">[class: prosjekter]<small>path: desktop_dash</small></a>
      <a href="om-meg.html" class="curtain-link">[asset id: om meg]<small>username:radwaag</small></a>
      <a href="cv.html" class="curtain-link">[super: CV]<small>section: experience_101</small></a>
    </nav>
  </header>

  <main class="ss-case">
    <!-- 1. INTRO — kicker + stor tittel + hovedbilde -->
    <section class="section ss-hero-section">

      <div class="ss-hero-top" data-reveal>
        <span class="kicker">UX-PROSJEKT · MOCKUP · 2026</span>
        <h1 class="ss-hero-title"><span class="ss-hero-title__a">Busken</span><span class="ss-hero-title__b"></span></h1>
      </div>

      <div class="ss-hero-media ss-hero-media--empty" data-reveal aria-hidden="true">
        <span>[ under arbeid ]</span>
      </div>

    </section>

    <!-- 2. LEAD + INTRO -->
    <section class="section">
      <div class="stack">

        <p class="lead" data-reveal>Mockup under arbeid. Mer kommer snart.</p>

      </div>
    </section>

    <!-- Når Busken er klar: kopier seksjonene "Rolle, team & leveranse", "Designprosess"
         og "Læring" fra sunsaver.html eller catgym.html hit og fyll inn. Stilen kommer fra
         case.css, så de ser like ut automatisk. -->

    <section class="section">
      <nav class="case-nav" aria-label="Flere prosjekter">
        <a href="friendverse.html" class="btn btn-outline curtain-link">← FriendVerse</a>
        <a href="prosjekter.html" class="btn btn-outline curtain-link">Se alle prosjekter</a>
      </nav>
    </section>

  </main>

  <footer>
    <span class="footer-watermark">Radwa Godor</span>
  </footer>

  <script src="shared.js"></script>
  <script src="case.js"></script>

</body>

</html>
