<!DOCTYPE html>
<html lang="no">
<head>
  <!-- Anti-FOUC for the curtain page-transition: runs before body paints, so if we
       arrived via a curtain-nav link (see shared.js), the curtain is held fully closed
       from the very first frame instead of flashing this page unclothed first. -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('curtainNav') === '1') {
          document.documentElement.classList.add('curtain-entering');
          sessionStorage.removeItem('curtainNav');
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radwa Godor - Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="hero.css" />
</head>
<body>

  <!-- Curtain used for the nav-link page transitions (see shared.js's initNavTransitions
       / initEntryReveal). Placed first so it's the first thing painted, ahead of any
       page content beneath it. -->
  <div class="page-transition-curtain" aria-hidden="true"></div>

  <!-- HEADER (shared markup; hero.css + hero.js layer the scroll-driven reveal/grow/center
       on top of it — see STEPS 2 & 3 there. Subpages get this same markup with none of
       that layered on, per STEP 5. No logo here: we're already on Home, so a "return home"
       link doesn't add anything — hero.css centers the nav to fill the space instead. -->
  <header>
    <nav class="nav-links">
      <a href="prosjekter.html" class="curtain-link">[class: prosjekter]<small>path: desktop_dash</small></a>
      <a href="om-meg.html" class="curtain-link">[asset id: om meg]<small>username:radwaag</small></a>
      <a href="cv.html" class="curtain-link">[super: CV]<small>section: experience_101</small></a>
    </nav>
  </header>

  <!-- HERO (pinned scroll-jack: .hero-pin holds the scroll distance, .hero is the sticky, pinned viewport) -->
  <section class="hero-pin">
    <section class="hero">
    <div class="hero__bg" aria-hidden="true">
      <img src="video_background.webp" width="1280" height="832" alt="" class="hero__bg-image" />
      <video class="hero__bg-video" src="video_background.mp4" poster="video_background.webp" muted loop playsinline preload="none"></video>
    </div>
    <div class="hero__ascii" aria-hidden="true"></div>

    <div class="hero__content">
      <p class="hero__tag">
        <span class="hero__tag-shadow" aria-hidden="true">[portefølje]</span>
        <span class="hero__tag-front">[portefølje]</span>
      </p>
      <h1 class="hero__title">
        <span class="hero__title-shadow" aria-hidden="true">[Radwa Godor]</span>
        <span class="hero__title-front">[Radwa Godor]</span>
      </h1>
    </div>

    <!-- STEP 4/5: same curtain transition as the header links — there's nothing further
         to scroll into on this page, so this arrow is the "keep going" handoff to Om meg. -->
    <a href="om-meg.html" class="hero__scroll curtain-link" aria-label="Scroll ned">↓</a>
    </section>
  </section>

  <script src="hero.js"></script>
  <script src="shared.js"></script>

</body>
</html>
